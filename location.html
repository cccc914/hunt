<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>获取当前经纬度</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #111; color: #0f0; }
        #coords { font-size: 24px; margin: 20px 0; }
        button { padding: 12px 24px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>📍 当前 WGS-84 坐标</h1>
    <div id="coords">点击下方按钮获取定位...</div>
    <button onclick="getLocation()">获取我的经纬度</button>
    <p style="color:#888; font-size:14px;">请允许浏览器访问位置信息。建议在窗边或室外操作。</p>

    <script>
        function getLocation() {
            const el = document.getElementById('coords');
            if (!navigator.geolocation) {
                el.innerText = '浏览器不支持定位';
                return;
            }
            el.innerText = '正在定位...';
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude.toFixed(6);
                    const lng = pos.coords.longitude.toFixed(6);
                    el.innerHTML = `纬度 latitude: <b>${lat}</b><br>经度 longitude: <b>${lng}</b>`;
                },
                (err) => {
                    el.innerText = '定位失败：' + err.message;
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
