<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LBS AR 实景寻宝</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #status { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); color: #0f0; padding: 10px; font-family: monospace; z-index: 999; font-size: 14px; }
        #treasure-info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); color: #ff0; padding: 10px; font-family: sans-serif; z-index: 999; display: none; border-radius: 8px; }
    </style>
</head>
<body>
    <!-- 状态提示 -->
    <div id="status">🛰️ 正在获取定位...</div>
    <div id="treasure-info">🎉 恭喜！你找到了宝箱！<br>请凭此页面找老师领取奖励！</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; gpsMinDistance: 0; gpsTimeInterval: 1000;imulateLatitude: 26.579; simulateLongitude: 106.713;">
        
        <!-- 虚拟宝箱1：设置一个坐标（比如教室讲台附近的经纬度） -->
        <!-- 注意：请将 latitude 和 longitude 替换为你教室的真实坐标！ -->
        <a-entity 
            id="treasure1"
            gps-entity-place="latitude: 26.6464; longitude: 106.586812;" position="0 165 0;"
            geometry="primitive: box; width: 1; height: 1; depth: 1;" 
            material="color: gold; opacity: 0.9;" 
            scale="0.5 0.5 0.5"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear;">
            <a-text value="🎁" position="0 0.6 0" scale="2 2 2" align="center"></a-text>
        </a-entity>

        <!-- 虚拟宝箱2：另一个坐标 -->
        <a-entity 
            id="treasure2"
            gps-entity-place="latitude: 26.580; longitude: 106.714;" 
            geometry="primitive: box; width: 1; height: 1; depth: 1;" 
            material="color: cyan; opacity: 0.9;" 
            scale="0.5 0.5 0.5"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear;">
            <a-text value="💎" position="0 0.6 0" scale="2 2 2" align="center"></a-text>
        </a-entity>

        <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
        // 监听定位状态
        window.addEventListener('gps-camera-update-position', (e) => {
            document.getElementById('status').innerText = 
                `📍 当前坐标: ${e.detail.position.latitude.toFixed(4)}, ${e.detail.position.longitude.toFixed(4)}`;
        });

        // 监听是否进入宝箱范围（模拟点击/触发）
        // AR.js 默认距离小于 gpsMinDistance 时会触发事件
        let found = false;
        document.querySelectorAll('[gps-entity-place]').forEach(el => {
            el.addEventListener('gps-entity-place-update', (e) => {
                // 当距离非常近时触发
                if (e.detail.distance < 5 && !found) { 
                    found = true;
                    document.getElementById('treasure-info').style.display = 'block';
                    // 震动反馈
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            });
        });
    </script>
</body>
</html>
